version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: freightsight
      POSTGRES_PASSWORD: password
      POSTGRES_DB: freightsight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: 
      context: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://freightsight:password@db/freightsight_db
      - REDIS_URL=redis://redis:6379/0
      - VIZION_API_KEY=your_vizion_api_key
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
    command: celery -A tasks.celery_app worker --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://freightsight:password@db/freightsight_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

volumes:
  postgres_data:

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: fs
      POSTGRES_PASSWORD: fs
      POSTGRES_DB: fs
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fs"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ./backend
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://fs:fs@db/fs
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://fs:fs@db/fs
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata: {}

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # SQLAlchemy 2.1 retypes Select (257 mypy errors on PR #20), and inside the group it held back
      # every other Python bump. 2.0 patches still come; lift this once the code is typed for 2.1.
      - dependency-name: sqlalchemy
        versions: [">=2.1"]
      # Migration 0005 installs procrastinate's 3.9 schema and refuses to run against another: a
      # minor bump needs its own migration, so it is a piece of work, not a weekly bump (PR #27).
      - dependency-name: procrastinate
        versions: [">=3.10"]
      # pypdf 7 is a major of the invoice reader's parser: it goes in on its own, after a run of the
      # invoice-reading bench, as the pin in pyproject.toml says.
      - dependency-name: pypdf
        versions: [">=7"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      # TypeScript 7 and Sentry 11 both fail the build and the browser tests as a plain bump: each is
      # a migration of its own (Sentry 11 also changes what the SDK collects by default).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sentry/nextjs"
        update-types: ["version-update:semver-major"]

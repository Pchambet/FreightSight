version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # SQLAlchemy 2.1 retypes Select (257 mypy errors on PR #20), and inside the group it held back
      # every other Python bump. 2.0 patches still come; lift this once the code is typed for 2.1.
      - dependency-name: sqlalchemy
        versions: [">=2.1"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor:
        update-types: [minor, patch]
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
